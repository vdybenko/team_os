<html lang="uk">
<head>

<style>

--ink:light-dark(#111111,#f1f1f1);--mut:light-dark(#686868,#9c9c9c);--line:light-dark(#e4e4e0,#2b2b2b);--line2:light-dark(#d4d4cf,#3a3a3a);
--red:#e4002b;--redbg:light-dark(#fde8ec,#3a0d16);--amber:light-dark(#9a5b00,#f0b45a);--amberbg:light-dark(#fff3dc,#3a2a0c);
--green:light-dark(#0b7a52,#4fd19c);--greenbg:light-dark(#e3f5ec,#0f2e22);--hi:light-dark(#fff2a6,#4b4310);--blue:light-dark(#1f4fd8,#7fa2ff);--bluebg:light-dark(#e8eefc,#14203d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-stretch:112%;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800}h2{font-size:18px;font-weight:750}h3{font-size:15px;font-weight:700}
.i{flex:none;vertical-align:-3px}
.proto-banner{background:var(--ink);color:var(--bg);font-size:13px;padding:6px 16px;text-align:center}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.teamsw{display:flex;align-items:center;gap:8px;padding:8px;font-weight:700}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left;color:var(--ink);font-size:14.5px}
.nv:hover{background:var(--line)}
.nv.on{background:var(--ink);color:var(--bg)}
.nv.stub{color:var(--mut)}
.nv .bd{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;line-height:18px}
.nv .new{margin-left:auto;font-size:10.5px;font-weight:700;border-radius:20px;padding:0 6px;line-height:17px;background:var(--bluebg);color:var(--blue)}
.nv.on .new{background:var(--bg)}
.sect{font-size:12px;font-weight:700;color:var(--mut);padding:14px 10px 4px}
.spacer{flex:1}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:58px}
.viewas{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut);margin-left:auto}
.viewas select{padding:5px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--card)}
.burger{display:none}
.page{padding:26px 28px 120px;max-width:1280px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.row:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.lnk{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;font-size:inherit;font-weight:600}
.hd{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.hd .sub{color:var(--mut);margin-top:6px}
.hd .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.crumb{font-size:13px;color:var(--mut);margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap;border:0}
.chip.red{background:var(--redbg);color:var(--red)}.chip.amber{background:var(--amberbg);color:var(--amber)}.chip.green{background:var(--greenbg);color:var(--green)}.chip.blue{background:var(--bluebg);color:var(--blue)}
.chip.ink{background:var(--ink);color:var(--bg)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.av{--s:24px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c,#888);color:#fff;display:inline-grid;place-items:center;font-size:calc(var(--s)*.45);font-weight:700;flex:none;position:relative}
.av.ext{background:var(--soft);color:var(--mut);border:1px dashed var(--line2)}
.av.gone{opacity:.45;filter:grayscale(1)}
.av .ck{position:absolute;right:-3px;bottom:-3px;width:13px;height:13px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--card);font-size:8px;color:#fff}
.av .ck.y{background:var(--green)}.av .ck.n{background:var(--red)}.av .ck.w{background:var(--line2)}
.avs{display:inline-flex;gap:4px}
.hint{font-size:13px;color:var(--mut)}
.empty{color:var(--mut);padding:18px 8px;text-align:center;font-size:14px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:10px 14px;font-size:13.5px;color:var(--mut);margin-bottom:14px}

.banner.amber{background:var(--amberbg)}.banner.red{background:var(--redbg)}.banner.blue{background:var(--bluebg)}.banner.green{background:var(--greenbg)}

.banner b{font-weight:700}
.banner .acts{display:flex;gap:8px;flex-wrap:wrap}

.grp{font-size:12.5px;font-weight:700;color:var(--mut);margin:22px 0 8px;display:flex;gap:8px;align-items:center}
.grp:first-child{margin-top:0}
.row{display:flex;gap:14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card);cursor:pointer;width:100%;text-align:left}
.row:hover{border-color:var(--ink)}
.row.me{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.row .tt{flex:1;min-width:0}
.row .tt b{display:block;font-weight:650}
.row .tt .s{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.cov{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.pb{height:6px;border-radius:4px;background:var(--line);overflow:hidden;width:70px}
.pb i{display:block;height:100%;background:var(--ink);border-radius:4px}
.pb.big{width:100%;height:8px}
/* doc */
.sec{border-top:1px solid var(--line);padding:12px 0}
.sec:first-child{border-top:0;padding-top:0}
.sec h3{font-size:13px;color:var(--mut);font-stretch:100%;display:flex;gap:8px;align-items:center;margin-bottom:4px}
.sec h3 .lnk{margin-left:auto;font-weight:600;font-size:12.5px;color:var(--mut)}
.sec .miss{color:var(--mut);font-style:italic;font-size:14px}
ol.steps{margin:4px 0 0;padding-left:22px}ol.steps li{margin:3px 0}
.src{font-size:12.5px;color:var(--mut);border-left:3px solid var(--line2);padding-left:8px;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px -18px 14px;padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 10px;font-weight:600;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs .n{font-size:11px;background:var(--soft);border-radius:20px;padding:0 6px}
.tabs .n.red{background:var(--red);color:#fff}
.draft{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.draft.adv{border-style:dashed}
.draft .top2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.draft .top2 input{width:17px;height:17px;accent-color:var(--ink);margin:0}
.draft .txt{font-size:14.5px}
.draft .by{font-size:12.5px;color:var(--mut);margin-top:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.draft .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.draft.done{opacity:.6}
.kind{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:1px 7px;border-radius:6px;background:var(--soft)}
.kind.add{background:var(--greenbg);color:var(--green)}.kind.rep{background:var(--amberbg);color:var(--amber)}.kind.rem{background:var(--redbg);color:var(--red)}.kind.ext{background:var(--bluebg);color:var(--blue)}
.ver{display:grid;grid-template-columns:42px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.ver:first-child{border-top:0}
.ver .n{font-weight:800;font-stretch:112%}
.ver .m{font-size:12.5px;color:var(--mut)}
/* advocate */
.adv-h{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.adv-ico{width:36px;height:36px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.big-n{font:800 28px/1 Archivo,system-ui,sans-serif;font-stretch:112%}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.chk:first-child{border-top:0}
.chk .mk{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;margin-top:1px;font-size:11px;color:#fff}
.chk .mk.y{background:var(--green)}.chk .mk.n{background:none;border:2px solid var(--line2)}
.chk .body{flex:1}
.chk .sug{font-size:13px;color:var(--mut);margin-top:2px}
.chk .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.risk{border-left:3px solid var(--amber);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}
.alt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px}
.alt b{display:block;margin-bottom:2px}
.alt .pc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--mut);margin-top:6px}
.disc{font-size:12.5px;color:var(--mut);margin-top:12px}
/* agreements */
.cl{padding:12px 0;border-top:1px solid var(--line)}
.cl:first-child{border-top:0;padding-top:0}
.cl h3{font-size:14px;margin-bottom:3px;display:flex;gap:8px;align-items:center}
.cl.chg{background:var(--hi);margin:0 -10px;padding:12px 10px;border-radius:10px;border-top-color:transparent}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.diff div{border-radius:8px;padding:8px 10px;font-size:14px}
.diff .was{background:var(--redbg)}.diff .now{background:var(--greenbg)}
.diff small{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:2px}
.party{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.party:first-child{border-top:0}
.party .nm{flex:1}
.party .nm small{display:block;color:var(--mut);font-size:12.5px}
/* review */
.rv{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px;align-items:start}
.tr{position:sticky;top:76px}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:8px;font-size:14px}
.ln .ts{color:var(--mut);font-size:12px;padding-top:2px}
.ln.hl{background:var(--hi)}
.prop{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.prop:hover{border-color:var(--ink)}
.prop.off{opacity:.5}
.prop>input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink);flex:none}
.prop .pb2{flex:1;min-width:0}
.prop .ev{font-size:13.5px;color:var(--mut);margin-top:8px;border-left:3px solid var(--line2);padding-left:9px}
.prop .next{font-size:12.5px;margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--mut)}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mut);align-items:center;margin-top:6px}
.fields select{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px 6px;font-size:13px;color:var(--ink)}
/* forms & modal */
select.in,input.in,textarea.in{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 9px;font-size:14px;min-height:36px;width:100%}
textarea.in{resize:vertical}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:600;margin-bottom:12px}
.lv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.lv button{border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px;text-align:left;font-size:13px;color:var(--mut)}
.lv button b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.lv button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ov{position:fixed;inset:0;background:#0006;z-index:30;display:grid;place-items:start center;padding:8vh 16px;overflow:auto}
.md{background:var(--card);border-radius:16px;width:min(620px,100%);box-shadow:0 30px 80px #0005;padding:20px 22px}
.md.wide{width:min(760px,100%)}
.mdh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mdh .x{margin-left:auto}
.mdf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center;flex-wrap:wrap}
.mdf .hint{margin-right:auto}
.pchk{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.pchk label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:20px;padding:4px 10px 4px 6px;font-size:13.5px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:50;max-width:min(560px,90vw);text-align:center}
.scrim{display:none}
@media(max-width:1000px){.split,.rv{grid-template-columns:minmax(0,1fr)}.tr{position:static}.g2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-105%);transition:transform .2s}
  .side.on{transform:none}
  .scrim.on{display:block;position:fixed;inset:0;background:#0005;z-index:35}
  .burger{display:inline-flex}
  .top{padding:10px 16px;flex-wrap:wrap}.page{padding:20px 16px 100px}
  .viewas{margin-left:0;width:100%}
  .lv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{flex-wrap:wrap}.row .rt{flex-direction:row;align-items:center;width:100%;justify-content:flex-start;flex-wrap:wrap}
  .diff,.alt .pc{grid-template-columns:minmax(0,1fr)}
  h1{font-size:25px}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>

const pendParties = (a) => a.pending?.parties || activeParties(a);

}

}

function proposeOpts(p) {
  const o = [{ kind: 'add', target: 'steps', at: null, label: 'Додати крок у кінець' }];
  p.sec.steps.forEach((s, n) => o.push({ kind: 'add', target: 'steps', at: n, label: `Додати крок перед ${n + 1}. ${s.t}` }));
  p.sec.steps.forEach((s, n) => o.push({ kind: 'rem', target: 'steps', at: n, label: `Прибрати крок ${n + 1}. ${s.t}` }));
  SECS.filter(([k]) => k !== 'steps').forEach(([k, l]) => { if (p.sec[k]) { o.push({ kind: 'ext', target: k, label: `Розширити: ${l}` }); o.push({ kind: 'rep', target: k, label: `Замінити: ${l}` }); } else o.push({ kind: 'add', target: k, label: `Описати: ${l}` }); });
  return o;
}
function syncModal() {
  const m = S.modal; if (!m) return;
  document.querySelectorAll('.md [data-m]').forEach((el) => { m[el.dataset.m] = el.type === 'checkbox' ? el.checked : el.value; });
}

    const p = proc(el.dataset.id), k = el.dataset.t;
    p.drafts.push({ id: nid('d'), kind: 'add', target: k, text: p.advice[k], by: S.as, on: TODAY, st: 'pending', adv: true });
    S.tab[p.id] = 'drafts'; render(); toast(canApprove(p) ? 'Порада стала драфтом — його можна прийняти' : `Драфт від вашого імені. Затверджує: ${approverLabel(p)}`);
  },
  dismiss: (el) => { const p = proc(el.dataset.id); (p.dismissed ||= []).push(el.dataset.t); render(); toast('Адвокат більше не показуватиме цю пораду для цієї версії'); },
  submitPropose: () => {
    syncModal(); const m = S.modal, p = proc(m.pid); const o = proposeOpts(p)[Number(m.opt)];
    if (o.kind !== 'rem' && !m.text.trim()) return toast('Опишіть зміну');
    p.drafts.push({ id: nid('d'), kind: o.kind, target: o.target, at: o.at, text: m.text.trim(), by: S.as, on: TODAY, st: 'pending' });
    S.modal = null; S.tab[p.id] = 'drafts'; render();
    toast(canApprove(p) ? 'Драфт додано. Ви можете його прийняти.' : `Драфт додано. Чекає на рішення: ${approverLabel(p)}`);
  },
  acceptDraft: (el) => { const p = proc(el.dataset.id); acceptDrafts(p, [p.drafts.find((d) => d.id === el.dataset.d)]); render(); },
  acceptSel: (el) => { const p = proc(el.dataset.id); const ds = p.drafts.filter((d) => S.sel[d.id] && d.st === 'pending'); acceptDrafts(p, ds); render(); },
  editAccept: (el) => { S.modal = { k: 'editAccept', pid: el.dataset.id, did: el.dataset.d }; render(); },
  submitEditAccept: () => { syncModal(); const m = S.modal, p = proc(m.pid); acceptDrafts(p, [p.drafts.find((d) => d.id === m.did)], m.text.trim()); S.modal = null; render(); },
  rejectDraft: (el) => { S.modal = { k: 'rejectDraft', pid: el.dataset.id, did: el.dataset.d }; render(); },
  submitRejectDraft: () => { syncModal(); const m = S.modal, d = proc(m.pid).drafts.find((x) => x.id === m.did); d.st = 'rejected'; d.reason = m.text.trim() || null; S.modal = null; render(); toast(`Відхилено. ${nm(d.by)} побачить причину.`); },
  // agreements
  agrAccept: (el) => {
    const a = agr(el.dataset.id); a.pending.consents[S.as] = { d: 'accept', at: TODAY };
    const n = a.pending.n;
    if (tryFinalize(a)) { S.tab[a.id] = 'text'; render(); toast(`Усі погодили — v${n} набула чинності й перескладена як цілісний текст`); }
    else { render(); const left = pendParties(a).filter((u) => a.pending.consents[u]?.d !== 'accept').map(nm); toast(`Ви погодили. Чекаємо: ${left.join(', ')}`); }
  },
  agrReject: (el) => { S.modal = { k: 'agrReject', aid: el.dataset.id }; render(); },
  submitAgrReject: () => { syncModal(); const m = S.modal, a = agr(m.aid); if (!m.text.trim()) return toast('Напишіть причину'); a.pending.consents[S.as] = { d: 'reject', at: TODAY, note: m.text.trim() }; S.modal = null; render(); toast(`Відхилено. Діє v${a.inForce?.n ?? '—'}, учасники бачать вашу причину`); },
  agrCounter: (el) => { const a = agr(el.dataset.id); const chg = [...changedClauses(a)]; S.modal = { k: 'counter', aid: a.id, cid: chg[0] || current(a).clauses[0].id }; render(); },
  submitCounter: () => {
    syncModal(); const m = S.modal, a = agr(m.aid);
    if (!m.text?.trim() || (m.cid === 'new' && !m.ct?.trim())) return toast('Заповніть пункт');
    const reset = editPending(a, (v) => { if (m.cid === 'new') v.clauses.push({ id: nid('c'), t: m.ct.trim(), x: m.text.trim() }); else v.clauses.find((c) => c.id === m.cid).x = m.text.trim(); }, a.pending?.note || 'Зміна від ' + nm(S.as));
    S.modal = null; S.tab[a.id] = a.inForce ? 'diff' : 'text'; render();
    toast(reset ? 'Ваш варіант на погодженні. Попередні згоди скинуто — погодити мають усі.' : 'Зміна на погодженні. Ви погодили її автоматично.');
  },
  advClause: (el) => {
    const a = agr(el.dataset.id); const x = checklist(a).find((c) => c.key === el.dataset.k);
    const reset = editPending(a, (v) => v.clauses.push({ id: nid('c'), t: x.sug.t, x: x.sug.x }), a.pending?.note || `Пункт «${x.sug.t}» за порадою адвоката`);
    render(); toast(reset ? `Пункт «${x.sug.t}» додано. Згоди скинуто — погодити мають усі.` : `Пункт «${x.sug.t}» додано в нову версію на погодженні`);
  },
  remind: (el) => toast(`Нагадування надіслано: ${nm(el.dataset.u)}`),
  extLink: (el) => {
    const a = agr(el.dataset.id); const u = el.dataset.u;
    a.pending.consents[u] = { d: 'accept', at: TODAY };
    const done = tryFinalize(a); render();
    toast(done ? `${nm(u)}: погоджено за посиланням — угода набула чинності` : `${nm(u)}: погоджено за посиланням (демо)`);
  },
  fullReview: (el) => { S.modal = { k: 'review', aid: el.dataset.id }; render(); },
  submitReview: () => {
    syncModal(); const m = S.modal, a = agr(m.aid);
    const parties = a.parties.filter((u) => m['p_' + u] !== false).map((u) => (U[u]?.left ? `ext:${U[u].name}` : u));
    a.pending = { n: a.inForce.n + 1, by: S.as, at: TODAY, note: `Повний перегляд: ${nm(a.review.party)} більше не в команді`, parties, consents: { [S.as]: { d: 'accept', at: TODAY } },
      clauses: a.inForce.clauses.map((c) => ({ ...c, x: (m['c_' + c.id] ?? c.x).trim() })).filter((c) => c.x) };
    S.modal = null; S.tab[a.id] = 'diff'; render();
    toast(`v${a.pending.n} на погодженні. Погодити мають: ${parties.map(nm).join(', ')}`);
  },
  newAgr: () => { S.modal = { k: 'newAgr', type: 'partnership' }; render(); },
  createAgr: () => {
    syncModal(); const m = S.modal;
    if (!m.title?.trim()) return toast('Вкажіть назву');
    const clauses = (m.clauses || '').split('\n').map((l) => l.trim()).filter(Boolean).map((l) => { const [t, ...x] = l.split(':'); return { id: nid('c'), t: x.length ? t.trim() : 'Пункт', x: (x.length ? x.join(':') : t).trim() }; });
    if (!clauses.length) return toast('Додайте хоча б один пункт');
    const parties = [S.as, ...TEAM.filter((u) => u !== S.as && m['p_' + u]), ...(m.ext?.trim() ? [`ext:${m.ext.trim()}`] : [])];
    if (parties.length < 2) return toast('Угода потребує щонайменше двох учасників');
    const a = { id: nid('a'), type: m.type, title: m.title.trim(), parties, inForce: null, past: [], pending: { n: 1, by: S.as, at: TODAY, note: 'Перша версія', consents: { [S.as]: { d: 'accept', at: TODAY } }, clauses } };
    AGRS.push(a); S.modal = null; S.tab[a.id] = 'advocate'; go('agr-' + a.id); toast('Угоду надіслано учасникам на погодження');
  },
  // inbox
  propOn: (el) => { const p = INBOX.find((i) => i.id === el.dataset.i).props.find((x) => x.id === el.dataset.p); p.on = el.checked; render(); },
  applyInbox: (el) => {
    const i = INBOX.find((x) => x.id === el.dataset.i);
    const src = (p) => ({ title: i.title, quote: i.lines[p.line][2] });
    for (const p of i.props.filter((x) => x.on)) {
      if (p.kind === 'proc_amend') {
        const pr = proc(p.proc); pr.drafts.push({ id: nid('d'), kind: p.op, target: p.target, at: p.at, text: p.text, by: S.as, on: TODAY, st: 'pending', src: src(p) });
        p.result = `Драфт у процесі «${esc(pr.title)}» · <button class="lnk" data-a="go" data-h="proc-${pr.id}">відкрити</button>`;
      } else if (p.kind === 'new_proc') {
        const np = { id: nid('pr'), level: p.level, ref: p.ref || undefined, title: p.title, summary: p.summary, status: 'draft', version: 0, creator: S.as, createdAt: TODAY, sec: sec0(), drafts: [], versions: [] };
        if (primary(np).includes(S.as)) { np.status = 'active'; np.version = 1; np.versions.push({ n: 1, at: TODAY, by: S.as, note: `Створено з «${i.title}»` }); }
        PROCS.push(np); p.result = `${np.status === 'active' ? 'Процес створено' : `Чернетка процесу, чекає на: ${esc(approverLabel(np))}`} · <button class="lnk" data-a="go" data-h="proc-${np.id}">відкрити</button>`;
      } else {
        const a = agr(p.agr);
        editPending(a, (v) => v.clauses.push({ id: nid('c'), t: p.clause.t, x: p.clause.x }), `Пункт «${p.clause.t}» з «${i.title}»`);
        a.pending.src = { title: i.title, who: i.lines[p.line][1], quote: i.lines[p.line][2] };
        p.result = `v${a.pending.n} на погодженні всіма учасниками · <button class="lnk" data-a="go" data-h="agr-${a.id}">відкрити</button>`;
      }
    }
    i.done = true; render(); toast('Крок 1 зроблено. Власники процесів і учасники угод побачили запити у «Чекає на мене»');
  },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'INPUT' && el.type === 'checkbox') return; // handled on change
  A[el.dataset.a]?.(el, e);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.a) { A[t.dataset.a]?.(t, e); return; }
  if (t.dataset.rr) { syncModal(); render(); return; }
  const f = t.dataset.f; if (!f) return;
  if (f === 'as') { S.as = t.value; S.sel = {}; render(); toast(`Тепер ви — ${U[S.as].name} (${ROLE[U[S.as].role]}${U[S.as].org ? `, Org ${ROLE[U[S.as].org]}` : ''})`); return; }
  if (f === 'vis') { const p = proc(t.dataset.id); p.vis = t.value; render(); toast(`Видимість: ${VIS[p.vis]}`); return; }
  if (f === 'propLevel') { const p = INBOX.find((i) => i.id === t.dataset.i).props.find((x) => x.id === t.dataset.p); const [l, r] = t.value.split(':'); p.level = l; p.ref = r || null; render(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });

S.route = location.hash.slice(1) || 'processes';
render();
</script>
</body>
</html>
