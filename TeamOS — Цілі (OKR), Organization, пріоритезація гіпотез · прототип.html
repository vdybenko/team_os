<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeamOS — Цілі (OKR), Organization, пріоритезація гіпотез · прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e0e0e);--side:light-dark(#f5f5f3,#151515);--card:light-dark(#ffffff,#161616);--soft:light-dark(#f6f6f4,#1c1c1c);
--ink:light-dark(#111111,#f1f1f1);--mut:light-dark(#686868,#9c9c9c);--line:light-dark(#e4e4e0,#2b2b2b);--line2:light-dark(#d4d4cf,#3a3a3a);
--red:#e4002b;--redbg:light-dark(#fde8ec,#3a0d16);--amber:light-dark(#9a5b00,#f0b45a);--amberbg:light-dark(#fff3dc,#3a2a0c);
--green:light-dark(#0b7a52,#4fd19c);--greenbg:light-dark(#e3f5ec,#0f2e22);--hi:light-dark(#fff2a6,#4b4310);--blue:light-dark(#1f4fd8,#7fa2ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3{font-stretch:112%;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800}h2{font-size:19px;font-weight:750}h3{font-size:15px;font-weight:700}
.i{flex:none;vertical-align:-3px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.teamsw{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;border:0;background:none;width:100%;text-align:left;font-weight:700}
.teamsw:hover{background:var(--line)}
.logo{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.tmenu{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px;margin:2px 0 6px;box-shadow:0 8px 24px #0002}
.tmenu button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:none;padding:7px 8px;border-radius:7px;text-align:left}
.tmenu button:hover{background:var(--soft)}
.srch{display:flex;align-items:center;gap:8px;margin:6px 0 10px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--mut);width:100%;text-align:left;font-size:14px}
.srch kbd{margin-left:auto}
kbd{font:600 11px Archivo,system-ui,sans-serif;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--mut);background:var(--card)}
.nv{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;border:0;background:none;width:100%;text-align:left;color:var(--ink);font-size:14.5px}
.nv:hover{background:var(--line)}
.nv.on{background:var(--ink);color:var(--bg)}
.nv .bd{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:20px;padding:0 7px;line-height:18px}
.nv.sub{padding-left:34px;font-size:13.5px;color:var(--mut)}.nv.sub.on{color:var(--bg)}
.sect{font-size:12px;font-weight:700;color:var(--mut);padding:14px 10px 4px}
.dot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none}
.spacer{flex:1}
.me{display:flex;align-items:center;gap:9px;padding:8px;border-top:1px solid var(--line);margin-top:8px;font-size:14px}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:58px}
.demo{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.demo select{padding:5px 8px;border-radius:8px;border:1px solid var(--line2);background:var(--card)}
.page{padding:26px 28px 120px;max-width:1320px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.nv:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.hd{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.hd .sub{color:var(--mut);margin-top:6px}
.hd .act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;padding:3px;gap:2px;background:var(--card);flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--mut)}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.sm button{padding:3px 9px;font-size:12.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.card h2{font-size:16px;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .lnk{margin-left:auto;font:600 13px Archivo,system-ui,sans-serif;color:var(--mut);border:0;background:none}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.95fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.col{display:flex;flex-direction:column;gap:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--soft);color:var(--mut);white-space:nowrap;border:0}
.chip.red{background:var(--redbg);color:var(--red)}.chip.amber{background:var(--amberbg);color:var(--amber)}.chip.green{background:var(--greenbg);color:var(--green)}
.chip.big{font-size:14px;padding:6px 12px;background:var(--card);border:1px solid var(--line);color:var(--ink)}
.chip.big b{font-size:16px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.av{--s:24px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c,#888);color:#fff;display:inline-grid;place-items:center;font-size:calc(var(--s)*.45);font-weight:700;flex:none}
.av.ext{background:var(--soft);color:var(--mut);border:1px dashed var(--line2)}
.avs{display:inline-flex}.avs .av{margin-left:-6px;border:2px solid var(--card)}.avs .av:first-child{margin-left:0}
.trow{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:9px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.trow:hover{background:var(--soft)}
.trow .tt{flex:1;min-width:0}
.trow .tt b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .mt{display:flex;gap:10px;align-items:center;margin-top:2px;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.st{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);flex:none}
.st.progress{border-color:var(--blue);background:conic-gradient(var(--blue) 0 50%,transparent 0)}
.st.waiting{border-color:var(--amber);border-style:dashed}
.st.done{border-color:var(--green);background:var(--green)}
.st.cancelled{border-color:var(--mut);background:var(--line2)}
.empty{color:var(--mut);padding:18px 8px;text-align:center;font-size:14px}
.lock{display:flex;gap:8px;align-items:flex-start;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--mut)}
.cmt{display:inline-flex;align-items:center;gap:3px}.cmt.new{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12.5px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}tbody tr:hover td{background:var(--soft)}
.grp td{background:var(--soft);font-weight:700;cursor:default}
select.in,input.in,textarea.in{border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:6px 9px;font-size:14px;min-height:34px}
textarea.in{width:100%;resize:vertical}
label.fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--mut);font-weight:600}
/* matrix + kanban */
.mx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.q{border:1px solid var(--line);border-radius:14px;padding:12px;min-height:250px;background:var(--card);transition:background .15s}
.q.over,.kcol.over{background:var(--soft);outline:2px dashed var(--line2)}
.q h3{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.q h3 small{font-weight:500;color:var(--mut);font-size:12.5px;font-stretch:100%}
.q.q11 h3{color:var(--red)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--soft);border-radius:14px;padding:10px;min-height:360px}
.kcol h3{display:flex;gap:8px;align-items:center;padding:4px 4px 10px}
.kc{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 11px;margin-bottom:8px;cursor:grab}
.kc:hover{border-color:var(--line2)}.kc b{font-weight:600;display:block;margin-bottom:6px;font-size:14px}
.kc .mt{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--mut)}
.dragging{opacity:.4}
/* drawer & modal */
#drawer{position:fixed;inset:0 0 0 auto;width:min(480px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 40px #0002;z-index:20;transform:translateX(105%);transition:transform .22s ease;overflow:auto}
#drawer.on{transform:none}
.dw{padding:18px 22px 40px}
.dwh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.task-drawer-actions{display:flex;gap:6px;margin-left:auto;flex:none}
.dwt{font:750 21px/1.2 Archivo,system-ui,sans-serif;font-stretch:108%;width:100%;border:1px solid transparent;border-radius:8px;padding:4px 6px;margin:0 -6px 8px;background:none;resize:none}
.dwt:not([readonly]):hover{border-color:var(--line2)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:9px 12px;align-items:center;font-size:14px;margin:14px 0}
.kv>span{color:var(--mut);font-size:13px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}
.box h3{font-size:13px;color:var(--mut);margin-bottom:8px;font-stretch:100%}
.quote{border-left:3px solid var(--line2);padding:2px 0 2px 10px;font-size:14px}
.hist{font-size:13px;color:var(--mut);display:grid;gap:6px}
.cm{display:flex;gap:9px;margin-bottom:10px;font-size:14px}.cm .when{color:var(--mut);font-size:12px}
.ov{position:fixed;inset:0;background:#0006;z-index:30;display:grid;place-items:start center;padding:8vh 16px;overflow:auto}
.md{background:var(--card);border-radius:16px;width:min(620px,100%);box-shadow:0 30px 80px #0005;padding:20px 22px}
.md.wide{width:min(760px,100%)}
.mdh{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mdh .x{margin-left:auto}
.mdf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;align-items:center}
.task-share-link{display:flex;gap:8px;margin-top:4px}.task-share-link input{flex:1}
.hint{font-size:13px;color:var(--mut)}
code{font-size:13px;background:var(--soft);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
/* inbox + review */
.irow{display:flex;align-items:center;gap:14px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.irow:hover{background:var(--soft)}
.iico{width:36px;height:36px;border-radius:10px;background:var(--soft);display:grid;place-items:center;flex:none}
.rv{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}
.src{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;padding:4px 14px 14px}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:6px 8px;border-radius:8px;font-size:14px;transition:background .15s}
.ln .ts{color:var(--mut);font-size:12px;padding-top:2px}
.ln b{font-weight:700}
.ln.hl{background:var(--hi)}
.sec{margin:22px 0 10px;display:flex;align-items:center;gap:8px}.sec:first-child{margin-top:0}
.sec .n{color:var(--mut);font-weight:600}
.prop{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card);transition:opacity .15s,border-color .15s}
.prop:hover{border-color:var(--ink)}
.prop.off{opacity:.5}
.prop>input{width:18px;height:18px;margin-top:3px;accent-color:var(--ink);flex:none}
.pbody{flex:1;min-width:0}
.ttl{font:650 15.5px Archivo,system-ui,sans-serif;width:100%;border:1px solid transparent;border-radius:7px;padding:3px 6px;margin:-3px -6px 6px;background:none}
.ttl:hover,.ttl:focus{border-color:var(--line2)}
.fields{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;color:var(--mut);align-items:center}
.fields label{display:inline-flex;align-items:center;gap:6px}
.fields select,.fields input[type=date]{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px 6px;font-size:13px;color:var(--ink);max-width:180px}
.fields input[type=checkbox]{accent-color:var(--ink)}
.ev{font-size:13.5px;color:var(--mut);margin-top:9px;border-left:3px solid var(--line2);padding-left:9px}
.ev .ts{font-size:12px;margin-left:4px}
.pmeta{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.conf{font-size:12px;font-weight:600;color:var(--green)}.conf.med{color:var(--amber)}
.warn{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--amberbg);color:var(--amber);border-radius:9px;padding:8px 10px;margin-top:9px;font-size:13.5px}
.warn .seg{margin-left:auto}
.warn.vis{background:var(--redbg,var(--amberbg));color:var(--red,var(--amber))}
.warn .cnote{display:block;margin-top:3px;opacity:.85}
.kplace{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-top:8px;color:var(--mut,inherit)}
.kplace .lnk{display:inline-flex;gap:5px;align-items:center}
.route{font-size:13px;color:var(--blue);margin-top:6px;display:flex;gap:6px;align-items:center}
.bar{position:sticky;bottom:0;z-index:4;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 -6px 30px #0001;padding:10px 14px;display:flex;align-items:center;gap:10px;margin-top:16px}.bar .hint{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum{background:var(--soft);border-radius:12px;padding:12px 16px;margin-bottom:18px}
.sum ul{margin:6px 0 0;padding-left:18px}
.done-box{text-align:center;padding:48px 20px}
.done-box .big{font:800 44px/1 Archivo,system-ui,sans-serif;font-stretch:115%}
.alias{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;background:var(--greenbg);color:var(--green);border-radius:20px;padding:2px 9px;font-weight:600}
/* calendar */
.cal{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px}
.cgrid{display:grid;border:1px solid var(--line);border-radius:14px;overflow:auto;background:var(--card)}
.ccol{position:relative;border-left:1px solid var(--line);min-width:150px}
.ccol:first-child{border-left:0;min-width:56px}
.chd{height:44px;display:flex;align-items:center;gap:7px;justify-content:center;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;position:sticky;top:0;background:var(--card);z-index:1}
.hr{height:48px;border-bottom:1px solid var(--line);font-size:11.5px;color:var(--mut);padding:2px 6px;text-align:right}
.evt{position:absolute;left:5px;right:5px;border-radius:8px;padding:4px 7px;font-size:12.5px;line-height:1.25;background:color-mix(in srgb,var(--c) 16%,var(--card));border-left:3px solid var(--c);cursor:pointer;overflow:hidden}
.evt b{display:block;font-weight:650}
.evt.busy{background:repeating-linear-gradient(135deg,var(--soft) 0 6px,var(--line) 6px 8px);border-left-color:var(--line2);color:var(--mut);cursor:default}
.now{position:absolute;left:0;right:0;height:2px;background:var(--red);z-index:2}
.cklist{display:grid;gap:6px;font-size:14px}.cklist label{display:flex;gap:8px;align-items:center}
.cklist input{accent-color:var(--ink);width:16px;height:16px}
/* mail */
.mrow{display:grid;grid-template-columns:180px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mrow .s{font-weight:650}.mrow .ai{color:var(--mut);font-size:13.5px}
/* knowledge */
.kn{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:10px;background:var(--card)}
.kn.sup{opacity:.55}.kn.sup .ktx{text-decoration:line-through}
.ktx{font-weight:600;font-size:15px;margin:6px 0 4px}
.km{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.ty{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--soft)}
.ty.decision{background:var(--ink);color:var(--bg)}
.tl{border-left:2px solid var(--line2);margin-left:6px;padding-left:18px}
.tl .kn{position:relative}.tl .kn::before{content:"";position:absolute;left:-25px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
/* projects + hyp */
.prog{height:8px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ink);border-radius:8px}
.hyp{border:1px solid var(--line);border-radius:14px;padding:15px 17px;background:var(--card);cursor:pointer}
.hyp:hover{border-color:var(--ink)}
.stmt{font-size:15px;line-height:1.45}.stmt em{font-style:normal;font-weight:700}
.bigstmt{font:600 24px/1.3 Archivo,system-ui,sans-serif;font-stretch:104%;max-width:900px}
.bigstmt em{font-style:normal;color:var(--mut);font-weight:500}
.doc{max-width:760px;font-size:16px;line-height:1.65}
.doc h2{margin:26px 0 8px}.doc[contenteditable=true]{outline:2px dashed var(--line2);outline-offset:10px;border-radius:4px}
/* person */
.mm{max-width:640px;margin:0 auto}
.mmcard{border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--card);box-shadow:0 10px 40px #0001}
.mmcard .t{font:750 24px/1.2 Archivo,system-ui,sans-serif;font-stretch:108%;margin:10px 0 14px}
.stbtns{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 12px}
/* login + onboarding */
@media(prefers-reduced-motion:reduce){#drawer{transition:none}}
.login-brand{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:28px}
.login-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.inv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px}
.ob{max-width:720px;margin:0 auto;padding:40px 24px}
.task-share-page .card{padding:clamp(18px,4vw,32px);overflow-wrap:anywhere}
.task-share-page h1{text-wrap:wrap}
.task-share-description{margin:20px 0 0;white-space:pre-wrap}
.task-share-comments{margin-top:14px}
.task-share-comments ul{list-style:none;margin:14px 0 0;padding:0}
.task-share-comments li+li{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}

// alignment chain: returns array of {g,k} from the starting KR up to the top, and whether it reaches a team goal
function chainFromKr(krId) {
  const out = []; let id = krId; const seen = new Set();
  while (id && !seen.has(id)) { seen.add(id); const g = goalOfKr(id); if (!g) break; out.push({ g, k: krById(id) }); id = g.aligned; }
  return out;
}

  const done = TASKS.filter((t) => t.st === 'done');

  return { total: done.length, aligned: al.length, pct: done.length ? al.length / done.length : 0, orphans: done.filter((t) => !taskAligned(t)) };
}

/* tree */
function krRisk(k, g) {
  if (g.level === 'member') return '';
  const kids = childrenOfKr(k.id), hs = hypsOfKr(k.id);
  if (g.level === 'project') return hs.length === 0 ? '<span class="rbadge r">немає гіпотез — ніхто не рухає KR</span>' : hs.length === 1 ? '<span class="rbadge a">одна ставка — немає альтернатив</span>' : '';
  if (g.level === 'team' && g.period.length > 4) return kids.filter((x) => x.level === 'project').length === 0 ? '<span class="rbadge r">жоден проєкт не працює над KR</span>' : '';
  return '';
}
function treeGoal(g, depth = 0) {
  const lv = g.level === 'team' ? (g.period.length === 4 ? 'Рік' : 'Квартал') : g.level === 'project' ? prj(g.project).name : U[g.member].name;
  const node = `<span class="tn goal ${g.level === 'team' ? 'team' : ''}" data-a="goal" data-id="${g.id}">${g.level === 'member' ? av(g.member, 18) : g.level === 'project' ? `<span class="dot" style="--c:${prj(g.project).color}"></span>` : ''}<span class="lv">${esc(lv)}</span>${esc(g.title)} <b>${P(gpct(g))}</b></span>`;
  const krs = g.krs.map((k) => {
    const kids = childrenOfKr(k.id).filter((x) => x.period === S.period);
    const hs = hypsOfKr(k.id).sort((a, b) => score(b) - score(a));
    const inner = [...kids.sort((a, b) => ({ team: 0, project: 1, member: 2 }[a.level] - { team: 0, project: 1, member: 2 }[b.level])).map((x) => `<li>${treeGoal(x, depth + 1)}</li>`), ...hs.map((h) => `<li><span class="tn hypn" data-a="go" data-h="hyp-${h.id}">${scb(h)}<b>${h.code}</b> ${esc(h.then.slice(0, 60))}${h.then.length > 60 ? '…' : ''} <span class="hint">· ${HST[h.st]}</span></span></li>`)].join('');
    return `<li><span class="tn krn" data-a="goal" data-id="${g.id}">${cd(k.conf)}<span class="lv">KR</span>${esc(k.t)} <span class="hint">${fmt(k.cur, k.unit)} / ${fmt(k.target, k.unit)}</span><span class="mini">${pb(k)}</span>${krRisk(k, g)}</span>${inner ? `<ul>${inner}</ul>` : ''}</li>`;
  }).join('');
  return `${node}<ul>${krs}</ul>`;
}

/* ================= goal drawer ================= */
function spark(k) {
  const pts = k.ch || []; if (pts.length < 2) return '';
  const w = 400, h = 46, lo = Math.min(k.start, ...pts.map((p) => p.v)), hi = Math.max(k.target, ...pts.map((p) => p.v));
  const x = (i) => 4 + (i / (pts.length - 1)) * (w * 0.45), y = (v) => h - 4 - ((v - lo) / (hi - lo || 1)) * (h - 8);
  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="4" x2="${w - 4}" y1="${y(k.target)}" y2="${y(k.target)}" stroke="var(--line2)" stroke-dasharray="4 4"/><line x1="4" x2="${w - 4}" y1="${h - 4}" y2="${y(k.target)}" stroke="var(--line)" stroke-dasharray="2 4"/><path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2"/>${pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="${p.c === 'off' ? 'var(--red)' : p.c === 'risk' ? '#e0a11b' : 'var(--green)'}"/>`).join('')}<text x="${w - 6}" y="${y(k.target) - 4}" text-anchor="end" font-size="10" fill="var(--mut)">ціль</text></svg>`;
}

function projHyps(p, hs) {
  const testing = hs.filter((h) => h.st === 'testing').length;
  const sorted = [...hs].sort(S.hsort === 'score' ? (a, b) => score(b) - score(a) : (a, b) => (a.code < b.code ? -1 : 1));
  const top2 = `<div class="chips" style="margin-bottom:14px;align-items:center">${canHyp(p) ? `<button class="btn pri" data-a="toast" data-v="Нова гіпотеза: та сама форма + блок пріоритезації (згорнутий)">${ico('plus')} Нова гіпотеза</button>` : `<span class="lockhint">${ico('lock', 13)} Гіпотези створюють учасники проєкту</span>`}
    <span class="seg sm">${[['cards', 'Картки'], ['matrix', 'Матриця 2×2'], ['rank', 'Рейтинг']].map(([k, l]) => `<button class="${S.hview === k ? 'on' : ''}" data-a="hview" data-v="${k}">${l}</button>`).join('')}</span>
    ${S.hview === 'cards' ? `<span class="seg sm">${[['score', 'За пріоритетом'], ['code', 'За номером']].map(([k, l]) => `<button class="${S.hsort === k ? 'on' : ''}" data-a="hsort" data-v="${k}">${l}</button>`).join('')}</span>` : ''}

    const mx = Math.max(...rows.map(score));
    return top2 + `<div class="card" style="padding:4px 8px"><table class="rk"><thead><tr><th>#</th><th>Гіпотеза</th><th>Рухає KR</th><th class="c" title="Вплив">I</th><th class="c" title="Надійність">C</th><th class="c" title="Швидкість">S</th><th class="c" title="Зусилля (час + гроші)">Зусилля</th><th>Пріоритет</th></tr></thead><tbody>${rows.map((h, i) => `<tr class="click" data-a="go" data-h="hyp-${h.id}"><td>${i + 1}</td><td><b>${h.code}</b> ${esc(h.then)} <span class="hint">· ${HST[h.st]}</span></td><td class="hint">${esc(krById(h.kr)?.t || '—')}</td><td class="c">${h.pr.i}</td><td class="c">${h.pr.c}</td><td class="c">${h.pr.s}</td><td class="c">${cost(h.pr)}</td><td style="white-space:nowrap"><span class="sbar" style="width:${Math.round((score(h) / mx) * 90)}px"></span> <b>${score(h)}</b></td></tr>`).join('')}</tbody></table></div>
    <p class="hint">Пріоритет = Вплив × Надійність × Швидкість ÷ Зусилля. Змінюється повзунками на сторінці гіпотези.</p>`;
  }

  const vx = ((5 - 1) / 9) * 100, hy = (25 / 50) * 88 + 4;
  return top2 + `<div class="mxax"><div class="mxw">
    <div class="qd" style="left:0;top:0">Quick wins<small>висока цінність, мало зусиль — робимо першими</small></div>
    <div class="qd" style="right:0;top:0;text-align:right">Великі ставки<small>цінно, але дорого — розбити на дешевший тест</small></div>

    <div class="ax" style="left:28px;right:0;bottom:6px;text-align:center">Зусилля: час команди + гроші →</div><div class="ax" style="left:-4px;top:200px;transform:rotate(-90deg);transform-origin:left top">Цінність: Вплив × Надійність →</div></div>
    <p class="hint">Розмір кола — швидкість (більше = швидше побачимо результат). Чорні — у статусі «Тестуємо».</p>`;
}

   <div class="card"><h2>Alignment</h2><div class="bigpct">${P(al.pct)}</div><p class="hint">${al.aligned} з ${al.total} закритих цього кварталу задач ведуть до KR команди.</p><div class="pb on" style="height:10px"><i style="width:${al.pct * 100}%"></i></div><div class="contrib"><div class="lbl2">Поза OKR</div>${al.orphans.slice(0, 4).map((t) => `<div class="dk"><span class="x">${av(t.owner, 16)} ${esc(t.t)}</span></div>`).join('')}<button class="lnk" style="margin:4px 0 0" data-a="treeGo">Дерево вирівнювання →</button></div></div>
   ${mine.length ? `<div class="card"><h2>Мої цілі</h2>${mine.map((g) => `<div class="dk" style="cursor:pointer" data-a="goal" data-id="${g.id}"><span class="x"><b>${esc(g.title)}</b></span><span class="hint">${P(gpct(g))}</span></div>`).join('')}</div>` : ''}
  </div><div class="col">
   <div class="card"><h2>${ico('mic')} AI: оновлення KR з мітингів</h2>${props.map((a) => { const k = krById(a.kr); const can = canCheckin(k); return `<div class="prop" style="display:block"><div style="font-weight:650">${esc(k.t)}: ${fmt(k.cur, k.unit)} → <b>${fmt(a.to, k.unit)}</b> ${cd(a.conf)}</div><div class="ev">“${esc(a.quote)}” <span class="ts">${esc(a.src)} · ${a.ts}</span></div><div class="pmeta">${can ? `<button class="btn pri sm" data-a="apply" data-v="${a.id}">Застосувати</button><button class="btn ghost sm" data-a="dismiss" data-v="${a.id}">Відхилити</button>` : `<span class="route">${ico('route', 13)} піде на підтвердження ${esc(U[k.owner].name)}</span>`}</div></div>`; }).join('') || '<div class="empty">Усе застосовано</div>'}</div>
   <div class="card"><h2>Check-in цього тижня</h2><p class="hint" style="margin-top:0">${myCk ? `${myCk} ваших KR чекають оновлення.` : 'Усі ваші KR оновлено ✓'}</p><button class="btn" data-a="toCheckin">Перейти до check-in</button></div>
  </div></div>`;
}

/* ================= modals ================= */
function alignOptions(m) {
  const opts = [];
  if (m.level === 'team' && m.period.length > 4) GOALS.filter((g) => g.level === 'team' && g.period === yearOf(m.period)).forEach((g) => opts.push([`Річна ціль ${yearOf(m.period)} · ${g.title}`, g.krs]));
  if (m.level === 'project') GOALS.filter((g) => g.level === 'team' && (g.period === m.period || g.period === yearOf(m.period))).forEach((g) => opts.push([`${periodLabel(g.period)} · ${g.title}`, g.krs]));
  if (m.level === 'member') {
    PROJECTS.filter((p) => p.members.includes(S.as)).forEach((p) => GOALS.filter((g) => g.level === 'project' && g.project === p.id && g.period === m.period).forEach((g) => opts.push([`${p.name} · ${g.title}`, g.krs])));
    GOALS.filter((g) => g.level === 'team' && g.period === m.period).forEach((g) => opts.push([`Команда · ${g.title}`, g.krs]));
  }
  return opts;
}
const ACTIVITY = /^(запустити|зробити|підготувати|написати|створити|провести|налаштувати|launch|build|ship)/i;
function goalModal() {
  const m = S.modal;
  const myProjects = PROJECTS.filter((p) => canProjectGoal(p));
  const lv = [['team', 'Команда', canTeamGoal(), 'Owner / Admin'], ['project', 'Проєкт', myProjects.length > 0, 'Owner проєкту / Admin'], ['member', 'Моя ціль', true, '']];
  const opts = alignOptions(m);
  const periodOpts = m.level === 'team' ? [['2027', 'Рік 2027'], ...PERIODS.slice(1).map((p) => [p.id, p.label])] : PERIODS.slice(1).map((p) => [p.id, p.label]);
  return `<div class="ov" data-a="ovClose"><div class="md wide" data-stop="1"><div class="mdh"><h2>Нова ціль</h2><button class="btn ghost sm" style="margin-left:auto" data-a="closeModal">${ico('x')}</button></div>
  <div class="mrow2"><span class="lbl3">Рівень</span><div class="rad">${lv.map(([k, l, ok, who]) => `<label class="${m.level === k ? 'on' : ''} ${ok ? '' : 'dis'}" title="${ok ? '' : 'Тільки ' + who}"><input type="radio" name="lvl" value="${k}" data-f="mlevel" ${m.level === k ? 'checked' : ''} ${ok ? '' : 'disabled'}>${l}${ok ? '' : ` ${ico('lock', 12)}`}</label>`).join('')}
   ${m.level === 'project' ? `<select class="in" style="width:auto" data-f="mproj">${myProjects.map((p) => `<option value="${p.id}" ${m.project === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>` : ''}</div></div>
  <div class="grid" style="grid-template-columns:1fr 1.4fr;gap:14px;margin-top:14px"><label class="fl">Період<select class="in" data-f="mperiod">${periodOpts.map(([k, l]) => `<option value="${k}" ${m.period === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
   <div class="fl">Тип<div class="rad">${[['com', 'Committed', 'виконуємо на 100%'], ['asp', 'Aspirational', '70% — це успіх']].map(([k, l, s]) => `<label class="${m.type === k ? 'on' : ''}"><input type="radio" name="typ" value="${k}" data-f="mtype" ${m.type === k ? 'checked' : ''}>${l} <span class="hint">${s}</span></label>`).join('')}</div></div></div>
  <label class="fl" style="margin-top:14px">Objective — якісна ціль<input class="in" id="mTitle" value="${esc(m.title)}" placeholder="${m.level === 'member' ? 'Напр.: Запустити 3 сиквенси, на які відповідають' : 'Напр.: Довести, що outreach через Linxa продає'}"></label>
  <div class="mrow2"><span class="lbl3">Сприяє досягненню (KR рівнем вище)</span>
   ${opts.length ? `<select class="in" data-f="malign"><option value="">— обрати KR —</option>${opts.map(([lbl, krs]) => `<optgroup label="${esc(lbl)}">${krs.map((k) => `<option value="${k.id}" ${m.align === k.id ? 'selected' : ''}>${esc(k.t)} · ${fmt(k.cur, k.unit)} / ${fmt(k.target, k.unit)}</option>`).join('')}</optgroup>`).join('')}</select>` : `<div class="hint">${m.level === 'team' && m.period.length === 4 ? 'Річна ціль команди — верхній рівень. Цілі організації з\'являться пізніше.' : 'Немає цілей рівнем вище на цей період'}</div>`}
   ${!(m.level === 'team' && m.period.length === 4) ? `<div class="rad" style="margin-top:4px"><span class="hint" style="align-self:center">або свідомо без вирівнювання:</span>${[['growth', 'Розвиток'], ['bau', 'Підтримка / BAU']].map(([k, l]) => `<label class="${m.reason === k ? 'on' : ''}"><input type="checkbox" data-f="mreason" value="${k}" ${m.reason === k ? 'checked' : ''}>${l}</label>`).join('')}</div>` : ''}
   ${!m.align && !m.reason && !(m.level === 'team' && m.period.length === 4) ? `<div class="awarn">${ico('warn', 13)} Без вирівнювання ціль отримає позначку «Не вирівняно» і не рахуватиметься в Alignment.</div>` : ''}</div>
  <div class="mrow2"><span class="lbl3">Key Results — 2–5 вимірюваних результатів</span>
   <div class="krrow hint" style="font-size:12px;font-weight:600"><span>Що вимірюємо</span><span>Од.</span><span>Від</span><span>До</span><span>Відповідальний</span><span></span></div>
   ${m.krs.map((k, i) => `<div class="krrow"><input value="${esc(k.t)}" data-kr="${i}" data-kk="t" placeholder="Напр.: MRR з outreach"><input value="${esc(k.unit)}" data-kr="${i}" data-kk="unit" placeholder="$"><input type="number" value="${k.start}" data-kr="${i}" data-kk="start"><input type="number" value="${k.target}" data-kr="${i}" data-kk="target"><select data-kr="${i}" data-kk="owner">${Object.keys(U).map((u) => `<option value="${u}" ${k.owner === u ? 'selected' : ''}>${U[u].name}</option>`).join('')}</select><button class="btn ghost sm" data-a="krDel" data-v="${i}" aria-label="Прибрати">${ico('x', 13)}</button></div><div class="awarn" id="kw-${i}" style="${ACTIVITY.test(k.t.trim()) ? '' : 'display:none'}">${ico('warn', 13)} Схоже на задачу, а не на результат. Що зміниться в цифрах, коли це буде зроблено?</div>`).join('')}
   <button class="btn sm" style="justify-self:start" data-a="krAdd">${ico('plus', 13)} Key Result</button></div>
  <div class="mdf"><span class="hint" style="margin-right:auto">${m.level === 'member' ? 'Команда бачить усі цілі учасників.' : ''}</span><button class="btn" data-a="closeModal">Скасувати</button><button class="btn pri" data-a="goalCreate">Створити ціль</button></div></div></div>`;
}
function teamModal() {
  const m = S.modal;
  return `<div class="ov" data-a="ovClose"><div class="md" data-stop="1"><div class="mdh"><h2>Нова команда</h2><button class="btn ghost sm" style="margin-left:auto" data-a="closeModal">${ico('x')}</button></div>
  <label class="fl">Назва команди<input class="in" id="tName" value="${esc(m.name)}" placeholder="Напр.: Linxa Marketing"></label>
  <div class="mrow2"><span class="lbl3">Організація</span>
   ${ORGS.map((o) => `<label class="opt ${m.org === o.id ? 'on' : ''}" style="margin-bottom:8px"><input type="radio" name="org" value="${o.id}" data-f="torg" ${m.org === o.id ? 'checked' : ''} style="accent-color:var(--ink)"><span>${ico('org')} <b>${esc(o.name)}</b><br><span class="hint">${o.teams.map((t) => esc(t.name)).join(' · ')}</span></span></label>`).join('')}
   <label class="opt ${m.org === 'new' ? 'on' : ''}"><input type="radio" name="org" value="new" data-f="torg" ${m.org === 'new' ? 'checked' : ''} style="accent-color:var(--ink)"><span style="flex:1">${ico('plus')} <b>Нова організація</b>${m.org === 'new' ? `<input class="in" id="tOrg" style="margin-top:8px" value="${esc(m.orgName)}" placeholder="Назва організації">` : '<br><span class="hint">окрема компанія або клієнт</span>'}</span></label></div>
  <p class="hint">Організація лише групує команди. Доступу до задач, знань і цілей інших команд вона не дає.</p>
  <div class="mdf"><button class="btn" data-a="closeModal">Скасувати</button><button class="btn pri" data-a="teamCreate">Створити</button></div></div></div>`;
}

/* ================= render ================= */
function page() {
  const r = S.route;
  if (r === 'dashboard') return pDash();
  if (r === 'goals') return pGoals();
  if (r === 'people') return pPeople();
  if (r.startsWith('person-')) return pPerson(r.slice(7));
  if (r.startsWith('project-')) return pProject(r.slice(8));
  if (r.startsWith('hyp-')) return pHyp(r.slice(4));
  return pGoals();
}
function render() {
  app.innerHTML = `<div class="proto-banner"><b>Прототип</b> Goals (OKR) · Organization · пріоритезація гіпотез — демо-дані, кінець січня 2027. Перемикайте «Дивитись як», щоб побачити права.</div><div class="app">${side()}<main class="main">${topBar()}<div class="page">${page()}</div></main></div>
  <aside id="drawer" class="${S.drawer ? 'on' : ''}">${S.drawer ? drawer() : ''}</aside>${S.modal ? (S.modal.k === 'goal' ? goalModal() : teamModal()) : ''}`;
}
let toastT;
function toast(t) { document.querySelector('.toast')?.remove(); const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(() => d.remove(), 2600); }

/* ================= actions ================= */
const A = {
  go: (el) => go(el.dataset.h),
  goal: (el) => { S.drawer = el.dataset.id; render(); },
  closeDw: () => { S.drawer = null; render(); },
  tmenu: () => { S.tmenu = !S.tmenu; render(); },
  team: (el) => { S.tmenu = false; if (el.dataset.v !== 't1') { toast('У прототипі дані є лише для Linxa Agent'); render(); return; } S.team = el.dataset.v; render(); },
  newTeam: () => { S.tmenu = false; S.modal = { k: 'team', name: '', org: 'org1', orgName: '' }; render(); },
  teamCreate: () => {
    const name = document.getElementById('tName').value.trim(); if (!name) return toast('Вкажіть назву команди');
    const m = S.modal; let org = ORGS.find((o) => o.id === m.org);
    if (m.org === 'new') { const on = document.getElementById('tOrg')?.value.trim(); if (!on) return toast('Вкажіть назву організації'); org = { id: 'org' + (ORGS.length + 1), name: on, teams: [] }; ORGS.push(org); }
    org.teams.push({ id: 't' + Date.now(), name, logo: name.slice(0, 2) });
    S.modal = null; S.tmenu = true; render(); toast(`Команду «${name}» створено в організації ${org.name}`);
  },
  stub: () => toast('Цей розділ не змінюється — дивіться Цілі, проєкти, гіпотези, Учасники, Дашборд'),
  toast: (el) => toast(el.dataset.v),
  period: (el) => { S.period = el.dataset.v; render(); },
  gtab: (el) => { S.gtab = el.dataset.v; if (S.route !== 'goals') go('goals'); else render(); },
  treeGo: () => { S.gtab = 'tree'; S.period = '2027Q1'; go('goals'); },
  toCheckin: () => { S.gtab = 'checkin'; S.period = '2027Q1'; go('goals'); },
  ptab: (el) => { S.ptab = el.dataset.v; render(); },
  hview: (el) => { S.hview = el.dataset.v; render(); },
  hsort: (el) => { S.hsort = el.dataset.v; render(); },
  ckAll: (el) => { S.ckAll = el.dataset.v === '1'; render(); },
  ckc: (el) => { S['ckc-' + el.dataset.k] = el.dataset.v; el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el)); },
  ckFill: (el) => { document.getElementById('ckv-' + el.dataset.k).value = el.dataset.v; S['ckc-' + el.dataset.k] = el.dataset.c; const n = document.getElementById('ckn-' + el.dataset.k); if (!n.value) n.value = 'З транскрипту Weekly sync — 27 Jan'; el.closest('.ck').querySelectorAll('.cseg button').forEach((b) => b.classList.toggle('on', b.dataset.v === el.dataset.c)); },
  ckSave: (el) => {
    const id = el.dataset.k, k = krById(id); const v = Number(document.getElementById('ckv-' + id).value); const c = S['ckc-' + id] || k.conf; const n = document.getElementById('ckn-' + id).value;
    k.cur = v; k.conf = c; (k.ch ||= []).push({ d: '2027-02-02', v, c }); S.ckDone[id] = { v, c, n };
    AI_PROPOSALS.filter((a) => a.kr === id).forEach((a) => (S.applied[a.id] = true));
    render(); toast(`Check-in збережено: ${k.t} → ${fmt(v, k.unit)}`);
  },
  apply: (el) => { const a = AI_PROPOSALS.find((x) => x.id === el.dataset.v); const k = krById(a.kr); k.cur = a.to; k.conf = a.conf; (k.ch ||= []).push({ d: '2027-02-02', v: a.to, c: a.conf }); S.applied[a.id] = true; S.ckDone[a.kr] = { v: a.to, c: a.conf, n: 'З транскрипту ' + a.src }; render(); toast(`KR «${k.t}» оновлено з транскрипту`); },
  dismiss: (el) => { S.applied[el.dataset.v] = true; render(); },
  aiImp: (el) => { const h = hyp(S.route.slice(4)); h.pr.i = Number(el.dataset.v); render(); },
  newGoal: (el) => {
    let level = el.dataset.level || (canTeamGoal() ? 'team' : 'member');
    if (level === 'team' && !canTeamGoal()) level = 'member';
    const proj = el.dataset.proj || PROJECTS.find((p) => canProjectGoal(p))?.id || null;
    if (level === 'project' && !canProjectGoal(prj(proj))) { toast('Цілі проєкту додають Owner проєкту або Admin'); return; }
    S.modal = { k: 'goal', level, project: proj, period: S.period === '2026Q4' ? '2027Q1' : S.period, type: 'com', title: '', align: '', reason: '', krs: [{ t: '', unit: '', start: 0, target: 0, owner: S.as }] };
    if (el.dataset.proj && level === 'member') { const g = GOALS.find((x) => x.level === 'project' && x.project === el.dataset.proj && x.period === S.modal.period); if (g) S.modal.align = g.krs[0].id; }
    render(); document.getElementById('mTitle')?.focus();
  },
  closeModal: () => { S.modal = null; render(); },
  ovClose: (el, e) => { if (e.target === el) { S.modal = null; render(); } },
  krAdd: () => { syncModal(); if (S.modal.krs.length >= 5) return toast('Не більше 5 KR — інакше це вже не пріоритети'); S.modal.krs.push({ t: '', unit: '', start: 0, target: 0, owner: S.as }); render(); },
  krDel: (el) => { syncModal(); S.modal.krs.splice(Number(el.dataset.v), 1); if (!S.modal.krs.length) S.modal.krs.push({ t: '', unit: '', start: 0, target: 0, owner: S.as }); render(); },
  goalCreate: () => {
    syncModal(); const m = S.modal;
    if (!m.title.trim()) return toast('Напишіть objective');
    const krs = m.krs.filter((k) => k.t.trim());
    if (m.period.length > 4 && !krs.length) return toast('Квартальній цілі потрібен хоча б один KR');
    const id = 'gn' + Date.now();
    GOALS.push({ id, level: m.level, project: m.level === 'project' ? m.project : undefined, member: m.level === 'member' ? S.as : undefined, period: m.period, type: m.type, owner: S.as, title: m.title.trim(), aligned: m.align || null, reason: m.align ? null : m.reason || null,
      krs: krs.map((k, i) => ({ id: `${id}k${i}`, t: k.t.trim(), unit: k.unit, start: Number(k.start), cur: Number(k.start), target: Number(k.target), owner: k.owner, conf: 'on', ch: [] })) });
    S.modal = null; S.period = m.period.length === 4 ? S.period : m.period; S.drawer = id; render(); toast('Ціль створено');
  },
};
function syncModal() {
  const m = S.modal; if (!m || m.k !== 'goal') return;
  const t = document.getElementById('mTitle'); if (t) m.title = t.value;
  document.querySelectorAll('[data-kr]').forEach((el) => { m.krs[Number(el.dataset.kr)][el.dataset.kk] = el.value; });
}
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]'); if (!el) { if (S.tmenu && !e.target.closest('.tmenu')) { S.tmenu = false; render(); } return; }
  if (el.dataset.a === 'ovClose' && e.target !== el) return;
  e.stopPropagation(); A[el.dataset.a]?.(el, e);
});
document.addEventListener('change', (e) => {
  if (e.target.dataset.r) { render(); return; }
  const f = e.target.dataset.f; if (!f) return;
  if (f === 'as') { S.as = e.target.value; S.ckDone = {}; render(); toast(`Тепер ви — ${U[S.as].name} (${ROLE[U[S.as].role]})`); return; }
  if (f.startsWith('m')) {
    syncModal(); const m = S.modal; const v = e.target.value;
    if (f === 'mlevel') { m.level = v; m.align = ''; if (v !== 'team' && m.period.length === 4) m.period = '2027Q1'; if (v === 'project' && !m.project) m.project = PROJECTS.find((p) => canProjectGoal(p))?.id; }
    if (f === 'mproj') m.project = v;
    if (f === 'mperiod') { m.period = v; m.align = ''; }
    if (f === 'mtype') m.type = v;
    if (f === 'malign') { m.align = v; if (v) m.reason = ''; }
    if (f === 'mreason') { m.reason = e.target.checked ? v : ''; if (m.reason) m.align = ''; }
    render(); return;
  }
  if (f === 'torg') { const n = document.getElementById('tName')?.value || ''; S.modal.org = e.target.value; S.modal.name = n; render(); return; }
  if (f === 'hkr' || f === 'himp') { const h = hyp(S.route.slice(4)); if (f === 'hkr') h.kr = e.target.value; else h.imp = Number(e.target.value); render(); return; }
});
document.addEventListener('input', (e) => {
  const key = e.target.dataset.r;
  if (key) {
    const h = hyp(S.route.slice(4)); h.pr[key] = Number(e.target.value);
    document.getElementById('v-' + key).textContent = h.pr[key];
    document.getElementById('a-' + key).textContent = ANC[key](h.pr[key]);
    document.getElementById('v-cost').textContent = cost(h.pr);
    document.getElementById('formula').innerHTML = formulaHtml(h);
    document.getElementById('bigscore').innerHTML = scb(h, true);
    const [r, n] = rankIn(h); document.getElementById('rank').textContent = `#${r} з ${n} у проєкті`;
    const q = quad(h); const qc = document.getElementById('qchip'); qc.className = 'qchip ' + q[0]; qc.textContent = q[1];
    document.getElementById('cmp').innerHTML = cmpBars(h);
    return;
  }
  if (e.target.dataset.kr !== undefined && e.target.dataset.kk === 't') {
    // live hint for activity-like KR without full re-render
    const i = Number(e.target.dataset.kr); S.modal.krs[i].t = e.target.value;
    const w = document.getElementById('kw-' + i); if (w) w.style.display = ACTIVITY.test(e.target.value.trim()) ? '' : 'none';
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.modal) S.modal = null; else S.drawer = null; render(); } });

S.route = location.hash.slice(1) || 'goals';
render();

</script>
